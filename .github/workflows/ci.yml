name: CI

on:
  push:
    branches: [master, main]
    # Root tag plus every nested-module tag of the shared version train:
    # a bare "v*" pattern does NOT match "entitytag/v0.6.0" etc., and each
    # staircase tag must get its own frozen CI run (AGENTS.md, Release
    # Conventions).
    tags: ["v*", "client/v*", "entitytag/v*", "metrics/v*", "server/v*"]
  pull_request:

permissions:
  contents: read

# The five-module pattern set every workspace-spanning command needs ("./..."
# spans only the root module). Single source of truth: the pre-release gate
# asserts this env value matches scripts/pre-release-check.sh's PACKAGES.
env:
  PACKAGES: ./... ./client/... ./entitytag/... ./metrics/... ./server/...

# Pin the exact toolchain go.mod names on the Go build/test/lint jobs: the
# setup-go manifest can lag go.dev, and GOTOOLCHAIN forces the go command to
# fetch the precise version. Keep in sync with the `go` directive in go.mod.
# The govulncheck job is deliberately unpinned: it installs govulncheck@latest,
# and a future release declaring a newer Go must be able to fetch that
# toolchain instead of failing the install.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      # Multi-module workspace: the committed go.work joins all five modules
      # into one workspace build; $PACKAGES spans all of them.
      - name: Build
        run: go build $PACKAGES

      - name: Vet
        run: go vet $PACKAGES

      - name: Test with race detector
        run: go test -race -count=1 $PACKAGES

      - name: Coverage
        run: |
          go test -cover -coverprofile=coverage.out $PACKAGES
          go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Lint
        run: |
          golangci-lint run
          for mod in client entitytag metrics server; do
            (cd "$mod" && golangci-lint run --config ../.golangci.yml)
          done

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz ParseETag
        run: go test -run=^$ -fuzz=^FuzzParseETag$ -fuzztime=30s ./entitytag/...

      - name: Fuzz ParseETagList
        run: go test -run=^$ -fuzz=^FuzzParseETagList$ -fuzztime=30s ./entitytag/...

      - name: Fuzz ETag
        run: go test -run=^$ -fuzz=^FuzzETag$ -fuzztime=30s ./server/...

      - name: Fuzz HasNoStoreDirective
        run: go test -run=^$ -fuzz=^FuzzHasNoStoreDirective$ -fuzztime=30s ./client/...

  govulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    # Deliberately unpinned toolchain (GOTOOLCHAIN auto, govulncheck@latest):
    # a future release declaring a newer Go must be able to fetch that
    # toolchain instead of failing the install. The golang/govulncheck-action
    # was replaced by an explicit step because it passes go-package as ONE
    # quoted argument - the multi-module pattern set became a single bogus
    # pattern ("no packages matched", 2026-09-23).
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerabilities
        run: govulncheck $PACKAGES
