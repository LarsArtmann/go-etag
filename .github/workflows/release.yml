name: Release

# OQ3 decision (2026-09-23): releases are automated from the ROOT version tag.
# Nested module tags (entitytag/v*, server/v*, ...) deliberately do NOT trigger
# this workflow — the root vX.Y.Z tag is the release commit of the shared train
# and the only tag that gets a Release page; the proxy is the nested modules'
# consumer interface (AGENTS.md, Release Conventions).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract the CHANGELOG section for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="$(awk -v section="## [${version}]" '
            index($0, section) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "No CHANGELOG section for [${version}] - cut the CHANGELOG before tagging"
            exit 1
          fi
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --latest --title "$TAG" --notes "$notes"
